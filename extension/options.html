<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Kinguard extension settings</title>
  <style>
    body { font: 18px/1.5 system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; color: #1d2433; }
    input { width: 100%; font: inherit; padding: .6rem .8rem; border: 2px solid #ddd; border-radius: 10px; }
    button { font: inherit; font-weight: 700; background: #0f5c56; color: #fff; border: 0; border-radius: 10px; padding: .6rem 1.2rem; margin-top: .75rem; }
    .muted { color: #5b6474; }
  </style>
</head>
<body>
  <h1>Kinguard</h1>
  <label for="url"><strong>Kinguard app address</strong></label>
  <p class="muted">Where selected text is sent for checking. Use your hosted Kinguard app (for example https://your-project.web.app/).</p>
  <input id="url" type="url" />
  <button id="save">Save</button> <span id="status" class="muted"></span>
  <script src="options.js"></script>
</body>
</html>
